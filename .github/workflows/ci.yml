name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    name: lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format --check
        run: uv run ruff format --check src tests

      - name: import-linter (DATA_ARCHITECTURE.md §1 principle 2)
        run: uv run lint-imports

      - name: Unit tests (no infra)
        run: uv run pytest -m "not integration"

  integration:
    name: integration + alembic
    runs-on: ubuntu-latest
    needs: lint-unit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tandemn
          POSTGRES_PASSWORD: tandemn
          POSTGRES_DB: tandemn
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tandemn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TANDEMN_POSTGRES_URL: postgresql+psycopg://tandemn:tandemn@localhost:55432/tandemn
      TANDEMN_S3_ENDPOINT: http://localhost:59000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        run: uv sync --extra dev

      - name: Start MinIO
        run: |
          docker run -d --name tandemn-minio \
            -p 59000:9000 \
            -e MINIO_ROOT_USER=tandemn \
            -e MINIO_ROOT_PASSWORD=tandemn-dev-key \
            minio/minio:RELEASE.2025-04-08T15-41-24Z server /data

          for i in {1..30}; do
            if curl -fsS http://localhost:59000/minio/health/live >/dev/null; then
              echo "MinIO is healthy"
              exit 0
            fi
            sleep 2
          done

          echo "MinIO failed to become healthy"
          docker logs tandemn-minio
          exit 1

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Alembic check (ORM in sync with DB)
        run: uv run alembic check

      - name: Integration tests
        run: uv run pytest -m integration
