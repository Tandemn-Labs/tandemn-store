name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-unit:
    name: lint + unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        run: uv sync --extra dev

      - name: ruff check
        run: uv run ruff check src tests

      - name: ruff format --check
        run: uv run ruff format --check src tests

      - name: import-linter (DATA_ARCHITECTURE.md §1 principle 2)
        run: uv run lint-imports

      - name: Unit tests (no infra)
        run: uv run pytest -m "not integration"

  integration:
    name: integration + alembic
    runs-on: ubuntu-latest
    needs: lint-unit

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tandemn
          POSTGRES_PASSWORD: tandemn
          POSTGRES_DB: tandemn
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U tandemn"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      minio:
        image: minio/minio:RELEASE.2025-04-08T15-41-24Z
        env:
          MINIO_ROOT_USER: tandemn
          MINIO_ROOT_PASSWORD: tandemn-dev-key
        ports:
          - 59000:9000
        # GitHub Actions service containers don't support `command`,
        # so MinIO runs with its default entrypoint. The default
        # entrypoint is `minio server /data` when MINIO_* env vars
        # are present, which is what we want for tests.
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 30

    env:
      TANDEMN_POSTGRES_URL: postgresql+psycopg://tandemn:tandemn@localhost:55432/tandemn
      TANDEMN_REDIS_URL: redis://localhost:56379/0
      TANDEMN_S3_ENDPOINT: http://localhost:59000

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install deps
        run: uv sync --extra dev

      - name: Alembic upgrade head
        run: uv run alembic upgrade head

      - name: Alembic check (ORM in sync with DB)
        run: uv run alembic check

      - name: Integration tests
        run: uv run pytest -m integration
