name: tandemn-store

services:
  postgres:
    image: postgres:16-alpine
    container_name: tandemn-postgres
    environment:
      POSTGRES_USER: tandemn
      POSTGRES_PASSWORD: tandemn
      POSTGRES_DB: tandemn
    ports:
      # Bind to a non-default host port to avoid clashing with a
      # developer-local Postgres install on 5432.
      - "55432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tandemn"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    container_name: tandemn-minio
    environment:
      MINIO_ROOT_USER: tandemn
      MINIO_ROOT_PASSWORD: tandemn-dev-key
    ports:
      # Non-default host ports to avoid clashes with other MinIO installs.
      - "59000:9000"  # S3 API
      - "59001:9001"  # Web console
    volumes:
      - minio-data:/data
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
  minio-data:
