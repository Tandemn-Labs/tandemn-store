[project]
name = "tandemn-store"
version = "0.1.0"
description = "Tandemn canonical data layer: tandemn_system_data + tandemn_user_data"
authors = [
    { name = "Tandemn Labs" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
    # Models / serialization
    "pydantic>=2.7",

    # SQL + migrations
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",

    # Redis (KV + Streams)
    "redis>=5.0",

    # S3 / MinIO
    "boto3>=1.34",
    "botocore>=1.34",

    # Canonical IDs (sortable, time-ordered, URL-safe)
    "python-ulid>=3.0",

    # Credential-resolution HTTP layer (server in system_data, client
    # in user_data). httpx is used on both sides.
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "import-linter>=2.0",
    # Run the credentials FastAPI app on a real socket for the
    # end-to-end resolver test.
    "uvicorn>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/tandemn_system_data",
    "src/tandemn_user_data",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501"]  # line length handled by formatter

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires docker-compose stack (Postgres + Redis + MinIO) to be running",
]
