[project]
name = "tandemn-store"
version = "0.1.0"
description = "Tandemn canonical data layer: tandemn_system_data + tandemn_user_data"
authors = [
    { name = "Tandemn Labs" },
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "Apache-2.0" }

dependencies = [
    # Models / serialization
    "pydantic>=2.7",

    # SQL + migrations
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    # Postgres driver for SQLAlchemy.
    "psycopg[binary]>=3.2",

    # S3 / MinIO
    "boto3>=1.34",
    "botocore>=1.34",

    # Canonical IDs (sortable, time-ordered, URL-safe)
    "python-ulid>=3.0",

    # Credential-resolution HTTP layer (server in system_data, client
    # in user_data). httpx is used on both sides.
    "fastapi>=0.115",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pre-commit",
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.11",
    # Enforces that tandemn_user_data never imports tandemn_system_data.
    "import-linter>=2.0",
    # Run the credentials FastAPI app on a real socket for the
    # end-to-end resolver test.
    "uvicorn>=0.32",
]

[build-system]
# Used because we ship two top-level packages from src/.
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/tandemn_system_data",
    "src/tandemn_user_data",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # import sorting
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "C4",  # comprehensions
    "RUF", # Ruff-specific rules
    "N", #pep8-naming
    "W", #pycodestyle warnings rules
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
strict_equality = true
show_error_codes = true

[[tool.mypy.overrides]]
# boto3 ships no type stubs; the S3 surface we use is small.
module = ["boto3.*", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: requires docker-compose stack (Postgres + MinIO) to be running",
]
